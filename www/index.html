<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Teka Teki Silang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">🧩 TEKA TEKI SILANG</div>
        <h1>Asah Otakmu</h1>
      </div>
      <button id="themeButton" class="icon-button" aria-label="Ganti tema">🌙</button>
    </header>

    <section class="hero">
      <span class="badge">LEVEL 1 / 500</span>
      <h2>TTS Hari Ini</h2>
      <p>Mulai dari level pertama dan buka semua 500 level secara bertahap.</p>
      <button id="startButton" class="primary-button">▶ Mulai Bermain</button>
    </section>

    <section class="stats">
      <div class="stat"><strong id="streak">0</strong><span>🔥 Streak</span></div>
      <div class="stat"><strong id="coins">100</strong><span>🪙 Koin</span></div>
      <div class="stat"><strong id="score">0</strong><span>🏆 Skor</span></div>
    </section>

    <section class="menu">
      <button class="menu-card" data-action="levels">🧩 <span><b>500 Level</b><small>Pilih level permainan</small></span>›</button>
      <button class="menu-card" data-action="daily">📅 <span><b>TTS Harian</b><small>Tantangan baru setiap hari</small></span>›</button>
      <button class="menu-card" data-action="hint">💡 <span><b>Petunjuk</b><small>Gunakan koin untuk bantuan</small></span>›</button>
      <button class="menu-card" data-action="leaderboard">🏆 <span><b>Leaderboard</b><small>Lihat pencapaianmu</small></span>›</button>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
