<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Teka Teki Silang</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="splash-active">
<section id="introScreen" class="intro-screen" aria-label="Memuat permainan">
  <div class="intro-content">
    <div class="intro-icon">🧩</div>
    <div class="intro-title">TEKA TEKI SILANG</div>
    <div class="intro-level">LEVEL <strong id="introLevel">1</strong> / 500</div>
    <div class="intro-loader"><span></span></div>
    <div class="intro-loading">Memuat permainan...</div>
  </div>
</section>
<main class="app">
<header class="topbar">
  <div>
    <div class="eyebrow">🧩 TEKA TEKI SILANG</div>
    <h1>Level <span id="levelNumber">1</span> / 500</h1>
  </div>
  <button id="themeButton" class="icon-button" aria-label="Mode gelap">🌙</button>
</header>

<section class="stats">
  <div class="stat"><strong id="streak">0</strong><span>🔥 Streak</span></div>
  <div class="stat"><strong id="coins">100</strong><span>🪙 Koin</span></div>
  <div class="stat"><strong id="score">0</strong><span>⭐ Poin</span></div>
</section>

<section class="game">
  <div class="game-head">
    <span class="badge" id="difficulty">🟢 Pemula</span>
    <p id="progress">0 / 10 terjawab</p>
  </div>

  <div class="active-clue" id="activeClue">
    <span class="active-number" id="activeNumber">1</span>
    <div>
      <strong id="activeDirection">Mendatar</strong>
      <p id="activeText">Tekan salah satu kotak untuk melihat soal.</p>
    </div>
  </div>

  <div id="grid" class="grid" aria-label="Papan Teka Teki Silang"></div>

  <div class="controls">
    <button id="hintButton" class="hint-button">💡 Petunjuk <span>-5 poin</span></button>
    <button id="directionButton" class="direction-button" hidden>↔ Ganti arah</button>
  </div>

  <div class="clues">
    <h2>Soal</h2>
    <div id="clueList"></div>
  </div>

  <button id="checkButton" class="primary-button">✓ Periksa Jawaban</button>
  <button id="nextButton" class="secondary-button" hidden>➡️ Level Berikutnya</button>
  <p id="message" class="message" role="status"></p>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
